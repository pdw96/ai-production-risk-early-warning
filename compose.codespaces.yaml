# GitHub Codespaces(docker-in-docker)용 구성.
#   docker compose -f compose.codespaces.yaml up --build
# Codespaces에서는 컨테이너 간 bridge 통신의 SYN이 드롭되어 http://backend:8000 이 닿지 않는다.
# host 네트워크를 쓰면 두 컨테이너가 호스트의 3000/8000에 직접 바인딩되므로
# devcontainer.json의 forwardPorts 설정이 그대로 동작한다.
name: ai-production-risk-codespaces

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: erp
      # host 네트워크라 이 포트가 코드스페이스 밖으로 열릴 수 있다. 저장소에
      # 적힌 비밀번호를 쓰면 그 포트에 닿는 누구나 그대로 로그인한다.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 정하십시오}
      POSTGRES_DB: production_risk
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d production_risk"]
      interval: 3s
      timeout: 3s
      retries: 20
    network_mode: host

  backend:
    build: ./backend
    environment:
      # host 네트워크에서는 데이터베이스도 같은 네임스페이스의 127.0.0.1 이다.
      # 비밀번호가 주소에 들어가므로 URL 에 안전한 문자만 쓴다. 그 밖의 문자가
      # 필요하면 DATABASE_URL 을 직접 준다 — 그쪽이 이긴다.
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://erp:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 정하십시오}@127.0.0.1:5432/production_risk}
      SEED_SAMPLE_DATA: "1"
    depends_on:
      database:
        condition: service_healthy
    # network_mode: host 에서는 ports 매핑이 무시되고 호스트 포트를 직접 점유한다.
    network_mode: host

  frontend:
    build:
      context: ./frontend
      args:
        # host 네트워크에서는 백엔드가 같은 네트워크 네임스페이스의 127.0.0.1:8000 이다.
        # 이 값은 빌드 시점에 routes-manifest.json으로 구워지므로 런타임에 바꿀 수 없다.
        API_INTERNAL_BASE_URL: http://127.0.0.1:8000
    network_mode: host
    depends_on:
      - backend

volumes:
  database-data:
