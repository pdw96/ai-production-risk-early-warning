# 일반 Docker 호스트(로컬 PC, 서버)용 구성. bridge 네트워크를 사용한다.
#   docker compose up --build
# Codespaces에서는 컨테이너 간 bridge 통신이 막히므로 compose.codespaces.yaml을 쓴다.
name: ai-production-risk

services:
  backend:
    build: ./backend
    environment:
      # 컨테이너를 다시 만들어도 리스크 상태가 남도록 DB를 볼륨에 둔다.
      DATABASE_PATH: /data/production_risk.db
    volumes:
      - backend-data:/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # bridge 네트워크에서는 서비스 이름으로 백엔드에 접근한다.
        # 이 값은 빌드 시점에 routes-manifest.json으로 구워지므로 런타임에 바꿀 수 없다.
        API_INTERNAL_BASE_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  backend-data:
