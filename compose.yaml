# 일반 Docker 호스트(로컬 PC, 서버)용 구성. bridge 네트워크를 사용한다.
#   docker compose up --build
name: ai-production-risk

services:
  # 표를 보관하는 프로그램이 따로 돈다. SQLite 파일 하나였을 때와 달리 여럿이
  # 동시에 저장할 수 있고, 숫자 칸에 글자를 넣으면 거부하며, 제약을 그 부분만
  # 고칠 수 있다 — ERP 가 되면 입고·이동·검사·출하가 전부 쓰기이기 때문이다.
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: erp
      # 저장소에 비밀번호를 적어 두지 않는다. 값이 없으면 기동이 여기서 멈춘다 —
      # 기본값을 두면 그 기본값이 곧 저장소에 적힌 비밀번호이기 때문이다.
      #   echo 'POSTGRES_PASSWORD=...' >> .env   (compose 가 자동으로 읽는다)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 정하십시오}
      POSTGRES_DB: production_risk
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      # 백엔드가 마이그레이션부터 돌리므로, 데이터베이스가 받을 준비를 마치기
      # 전에 뜨면 첫 기동이 그냥 실패한다.
      test: ["CMD-SHELL", "pg_isready -U erp -d production_risk"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      # 비밀번호를 URL 에 끼워 넣으므로 **URL 에 안전한 문자만** 써야 한다 —
      # `/` `#` `?` `@` `%` 가 들어가면 주소가 깨지고 마이그레이션이 접속하지
      # 못한다. README 가 안내하는 `openssl rand -hex` 는 이 조건을 만족한다.
      # 그런 문자를 꼭 써야 하면 DATABASE_URL 을 직접 주면 된다 — 그쪽이 이긴다.
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://erp:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 정하십시오}@database:5432/production_risk}
      # 합성 시연 데이터를 넣는 스위치. 운영에서 자동 시드는 편의가 아니라
      # 사고이므로 기본값은 꺼짐이고, 여기서만 켠다.
      SEED_SAMPLE_DATA: "1"
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # bridge 네트워크에서는 서비스 이름으로 백엔드에 접근한다.
        # 이 값은 빌드 시점에 routes-manifest.json으로 구워지므로 런타임에 바꿀 수 없다.
        API_INTERNAL_BASE_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  database-data:
