name: Cloud validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # 운영과 컨테이너가 쓰는 엔진에서 돈다. 여기까지 CI 는 SQLite 하나로 돌았고,
    # PR #10 에서 걸린 방언 결함 셋(`LIKE` 대소문자 · 불리언 칸의 `1` ·
    # `trim`/`btrim`)은 **전부 CI 밖에서** 잡혔다 — 리뷰봇과 사람이 직접 컨테이너를
    # 띄워서다.
    #
    # 아래 주소와 서비스의 값이 어긋나면 접속이 그 자리에서 죽는다. 두 곳에 같은
    # 값을 적는 것을 사람의 주의에 맡기지 않는다 — `backend/tests/test_ci_workflow.py`
    # 가 이 파일을 읽어 짝을 확인한다.
    env:
      DATABASE_URL: postgresql+psycopg://erp:cloud-validation-throwaway@127.0.0.1:5432/production_risk

    services:
      database:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erp
          # 이 잡 안에서만 사는 컨테이너의 비밀번호다. 밖에서 닿지 않으므로 비밀이
          # 아니며, 운영 비밀번호(`.env` 의 `POSTGRES_PASSWORD`)는 여기 오지 않는다.
          POSTGRES_PASSWORD: cloud-validation-throwaway
          POSTGRES_DB: production_risk
        ports:
          - 5432:5432
        # 건강검사가 없으면 첫 접속이 컨테이너 기동보다 앞서 죽는다.
        options: >-
          --health-cmd "pg_isready -U erp -d production_risk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      # ── 운영이 실제로 타는 길 ──────────────────────────────────────────
      # `docker-entrypoint.sh` 와 같은 차례다: 옛 데이터베이스인지 보고,
      # 마이그레이션으로 표를 맞춘 뒤, 비어 있을 때만 채운다. 지금까지 CI 는
      # 인자 없는 `python -m app.seed`(= `drop_all`/`create_all`)만 돌려
      # **마이그레이션 경로를 한 번도 밟지 않았다.**
      - name: 기동 전 검사와 마이그레이션 (PostgreSQL)
        working-directory: backend
        run: |
          python -m app.db.preflight
          python -m alembic upgrade head

      - name: 컨테이너 기동과 같은 길로 시드 (PostgreSQL)
        working-directory: backend
        run: python -m app.seed --if-empty

      # ── 두 엔진 모두에서 돌린다 ────────────────────────────────────────
      # PostgreSQL 만 돌리면 안 되는 이유: 이 저장소는 SQLite 도 **함께 낸다**.
      # `app/core/config.py` 의 기본값이 SQLite 파일이고 `db/base.py` 에는
      # SQLite 전용 외래키 PRAGMA 가 있으며, 기존 검사 대부분이 스스로 SQLite
      # 엔진을 만들어 붙는다 — 그 길을 아무도 밟지 않으면 배포되는 코드의 한쪽이
      # 검증 없이 나간다.
      #
      # SQLite 만 돌리면 안 되는 이유는 위 서비스 블록의 주석에 있다.
      - name: 백엔드 검사 — PostgreSQL
        working-directory: backend
        run: python -m pytest tests -v

      - name: 백엔드 검사 — SQLite
        working-directory: backend
        env:
          # 빈 값이면 설정이 SQLite 파일로 떨어진다(`app/core/config.py`).
          DATABASE_URL: ""
        run: python -m pytest tests -v

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Check TypeScript
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start FastAPI and Next.js
        run: |
          (cd backend && python -m uvicorn app.main:app --host 127.0.0.1 --port 8000) > /tmp/backend.log 2>&1 &
          (cd frontend && npm run start -- --hostname 127.0.0.1 --port 3000) > /tmp/frontend.log 2>&1 &
          for attempt in {1..60}; do
            # FastAPI 자체와 Next.js 프록시 경로까지 확인해야 백엔드가 죽은 상태로 통과하지 않는다.
            if curl --fail --silent --max-time 5 http://127.0.0.1:8000/api/dashboard > /dev/null \
              && curl --fail --silent --max-time 5 http://127.0.0.1:3000/ > /dev/null \
              && curl --fail --silent --max-time 5 http://127.0.0.1:3000/api/dashboard > /dev/null; then
              echo "FastAPI(8000)와 Next.js(3000)가 ${attempt}초 만에 준비되었습니다."
              exit 0
            fi
            sleep 1
          done
          echo "서버 준비 대기 시간이 초과되었습니다."
          cat /tmp/backend.log /tmp/frontend.log
          exit 1

      - name: Install screenshot browser
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Capture cloud preview
        run: |
          mkdir -p artifacts/screenshots
          npx --yes playwright@1.55.0 screenshot --browser chromium --full-page --wait-for-timeout 3000 http://127.0.0.1:3000/ artifacts/screenshots/dashboard.png
          npx --yes playwright@1.55.0 screenshot --browser chromium --full-page --wait-for-timeout 3000 http://127.0.0.1:3000/orders artifacts/screenshots/orders.png
          npx --yes playwright@1.55.0 screenshot --browser chromium --full-page --wait-for-timeout 3000 http://127.0.0.1:3000/materials artifacts/screenshots/materials.png
          npx --yes playwright@1.55.0 screenshot --browser chromium --full-page --wait-for-timeout 3000 http://127.0.0.1:3000/risks artifacts/screenshots/risks.png
          npx --yes playwright@1.55.0 screenshot --browser chromium --full-page --wait-for-timeout 3000 http://127.0.0.1:3000/master artifacts/screenshots/master.png
          npx --yes playwright@1.55.0 screenshot --browser chromium --full-page --wait-for-timeout 3000 http://127.0.0.1:3000/purchases artifacts/screenshots/purchases.png
          npx --yes playwright@1.55.0 screenshot --browser chromium --full-page --wait-for-timeout 3000 http://127.0.0.1:3000/quality artifacts/screenshots/quality.png
          npx --yes playwright@1.55.0 screenshot --browser chromium --full-page --wait-for-timeout 3000 http://127.0.0.1:3000/materials/warehouses/raw artifacts/screenshots/warehouse-raw.png
          npx --yes playwright@1.55.0 screenshot --browser chromium --full-page --wait-for-timeout 3000 http://127.0.0.1:3000/materials/warehouses/production artifacts/screenshots/warehouse-production.png
          npx --yes playwright@1.55.0 screenshot --browser chromium --full-page --wait-for-timeout 3000 http://127.0.0.1:3000/materials/warehouses/products artifacts/screenshots/warehouse-products.png
          npx --yes playwright@1.55.0 screenshot --browser chromium --full-page --wait-for-timeout 3000 http://127.0.0.1:3000/sales artifacts/screenshots/sales.png

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-risk-screenshots
          path: artifacts/screenshots
          if-no-files-found: warn

      - name: Print server logs on failure
        if: failure()
        run: cat /tmp/backend.log /tmp/frontend.log || true
